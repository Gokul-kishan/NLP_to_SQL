name: Secure Build, Deploy, and Rollback Workflow

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  GAR_REPOSITORY: fastapi
  SERVICE_NAME: fastapi
  GCP_WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
  GCP_WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

jobs:
  # ==========================================
  # JOB 1: AUTHENTICATION & TOKEN GENERATION
  # ==========================================
  auth-gcp:
    name: 🔐 Auth GCP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      gcp_token: ${{ steps.auth.outputs.access_token }}
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}

  # ==========================================
  # JOB 2: DOCKER AUTH, BUILD & IMAGE PUSH
  # ==========================================
  build-and-push:
    name: 📦 Auth Docker & Build
    needs: auth-gcp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ needs.auth-gcp.outputs.gcp_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push with the unique commit SHA (Do NOT tag 'latest' yet)
      - name: Build and Push Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 3 & 4: DEPLOY, VERIFY HTTP 200 & ROLLBACK
  # ==========================================
  deploy-and-verify:
    name: 🚀 Deploy & Verify Health
    needs: [auth-gcp, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}

      # To support safe rollback, we fetch the active image tag BEFORE deploying the new one
      - name: Fetch Current Active Image (For Rollback Backup)
        id: backup
        run: |
          gcloud config set project ${{ env.PROJECT_ID }}
          CURRENT_IMAGE=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format="value(spec.template.spec.containers[0].image)" 2>/dev/null || echo "none")
          echo "previous_image=$CURRENT_IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy New Version to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      # Hits the live endpoint and expects a 200 OK. Retries 5 times with a 10s sleep in between.
      - name: Verify HTTP 200 Status
        id: health_check
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Testing service endpoint: $URL"
          for i in {1..5}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Health check passed with HTTP 200!"
              exit 0
            fi
            echo "⚠️ Health check returned $STATUS. Retrying in 10 seconds... (Attempt $i/5)"
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts."
          exit 1

      # This step executes ONLY if the verification step fails
      - name: 🚨 Rollback to Previous Image
        if: failure() && steps.backup.outputs.previous_image != 'none'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.backup.outputs.previous_image }}

  # ==========================================
  # JOB 5: PROMOTE TO LATEST ON SUCCESS
  # ==========================================
  promote-to-latest:
    name: 🏷️ Push Latest Tag
    needs: [auth-gcp, deploy-and-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }} # ${{ needs.auth-gcp.outputs.gcp_token }}

      # Pulls the verified image from the registry and adds the 'latest' tag
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag and Push Latest
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}"
          docker pull $IMAGE_PATH:${{ github.sha }}
          docker tag $IMAGE_PATH:${{ github.sha }} $IMAGE_PATH:latest
          docker push $IMAGE_PATH:latest


