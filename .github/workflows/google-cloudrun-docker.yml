name: 'Build and Deploy to Cloud Run'

on:
  push:
    branches:
      - "main"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # TODO: update to your Google Cloud project ID
  REGION: asia-south1 # TODO: update to your region
  GAR_REPOSITORY: fastapi
  SERVICE_NAME: fastapi # TODO: update to your service name
#   WORKLOAD_IDENTITY_PROVIDER: secrets.
jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    # Required permissions for WIF authentication
    permissions:
      contents: read
      id-token: write

    steps:
    # 1. Checkout the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Authenticate to Google Cloud using Workload Identity Federation
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    # 3. Authenticate Docker to your Google Artifact Registry region
    - name: Docker Auth
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGION }}-docker.pkg.dev
        username: _json_key_base64
        password: ${{ steps.auth.outputs.private_key }}

    # 4. Set up Docker Buildx (enables advanced caching and faster builds)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 5. Build the Docker image and push it to GAR
    - name: Build and Push Container Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 6. Deploy the newly pushed image to Google Cloud Run
    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

    # 7. (Optional) Show the URL of the deployed Cloud Run service
    - name: Show URL
      run: echo "Service URL is ${{ steps.deploy.outputs.url }}"
